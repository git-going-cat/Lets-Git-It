server:
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}    # Gmail 앱 비밀번호
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope:
              - email
              - profile

redis:
  auth:
    host: ${REDIS_AUTH_HOST}
    port: ${REDIS_AUTH_PORT}
  game:
    host: ${REDIS_GAME_HOST}
    port: ${REDIS_GAME_PORT}
  ranking:
    host: ${REDIS_RANKING_HOST}
    port: ${REDIS_RANKING_PORT}

logging:
  level:
    com.gitcat.letsgitit: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha

jwt:
  secret: ${JWT_SECRET}          # 서명용 비밀키 (256비트 이상 권장, .env에서 주입)
  access-expiration: 1800000     # Access Token 만료: 30분 (밀리초)
  refresh-expiration: 604800000  # Refresh Token 만료: 7일 (밀리초)

# 프론트 콜백 URL (리다이렉트 대상)
oauth2:
  frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback/google}
  cookie:
    secure: ${OAUTH2_COOKIE_SECURE:false}
