spring:
  datasource:
    url: jdbc:mysql://${PROD_MYSQL_HOST}:${PROD_MYSQL_PORT}/${PROD_MYSQL_DB}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${PROD_MYSQL_USERNAME}
    password: ${PROD_MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

server:
  port: 8080

logging:
  level:
    com.gitcat.letsgitit: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

redis:
  auth:
    host: ${PROD_REDIS_AUTH_HOST}
    port: ${PROD_REDIS_AUTH_PORT}

  game:
    host: ${PROD_REDIS_GAME_HOST}
    port: ${PROD_REDIS_GAME_PORT}

  ranking:
    host: ${PROD_REDIS_RANKING_HOST}
    port: ${PROD_REDIS_RANKING_PORT}