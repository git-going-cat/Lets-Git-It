spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 8080

# 실제 연결 없음 - @MockBean RedissonClient로 Redisson 대체, Lettuce는 lazy 연결
redis:
  auth:
    host: localhost
    port: 6379
  game:
    host: localhost
    port: 6380
  ranking:
    host: localhost
    port: 6381