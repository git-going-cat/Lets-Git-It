server {
    listen 443 ssl;
    server_name dev.lets-git-it.kr;

    ssl_certificate /etc/letsencrypt/live/dev.lets-git-it.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.lets-git-it.kr/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /faro/collect {
        proxy_pass http://grafana-agent:12347/collect;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
