server {
    listen 443 ssl;
    server_name agent-dev.lets-git-it.kr;

    ssl_certificate /etc/letsencrypt/live/dev.lets-git-it.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.lets-git-it.kr/privkey.pem;

    location /collect {
        proxy_pass http://grafana-agent:12347;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS (FE 도메인 허용)
        add_header Access-Control-Allow-Origin "https://dev.lets-git-it.kr" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
