deploy-dev-be:
  stage: deploy
  image: docker:latest
  tags: [dev]
  before_script:
    - apk add --no-cache git curl bash
    - git config --global --add safe.directory /home/ubuntu/develop/S14P31A304
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - BE/**/*
  script:
    - cd /home/ubuntu/develop/S14P31A304
    - git pull origin develop
    - bash INFRA/deploy-be.sh

deploy-dev-fe:
  stage: deploy
  image: docker:latest
  tags: [dev]
  before_script:
    - apk add --no-cache git curl bash
    - git config --global --add safe.directory /home/ubuntu/develop/S14P31A304
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - FE/**/*
        - nginx/**/*
        - INFRA/Dockerfile.fe
  script:
    - cd /home/ubuntu/develop/S14P31A304
    - git pull origin develop
    - bash INFRA/deploy-fe.sh