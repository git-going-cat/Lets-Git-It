deploy-dev-be:
  stage: deploy
  image: docker:latest
  tags: [dev]
  before_script:
    - apk add --no-cache git curl bash
    - git config --global --add safe.directory /home/ubuntu/develop/S14P31A304
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - BE/**/*
        - INFRA/Dockerfile.be
        - INFRA/deploy-be.sh
        - INFRA/docker-compose.be.yml
  script:
    - git config --global credential.helper store
    - cp /home/ubuntu/.git-credentials /root/.git-credentials
    - cd /home/ubuntu/develop/S14P31A304
    - git config pull.rebase false
    - git pull origin develop
    - bash INFRA/deploy-be.sh

