deploy-dev:
  stage: deploy
  image: docker:latest
  tags: [dev]
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory /home/ubuntu/develop/S14P31A304
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - cd /home/ubuntu/develop/S14P31A304
    - git pull origin develop
    - docker compose -f INFRA/docker-compose.be.yml up -d --build spring
    - docker compose -f INFRA/docker-compose.fe.yml up -d --build nginx
