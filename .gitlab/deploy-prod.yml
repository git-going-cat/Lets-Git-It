deploy-prod-be:
  stage: deploy
  image: docker:latest
  tags: [prod]
  before_script:
    - apk add --no-cache git curl bash
    - git config --global --add safe.directory /home/ubuntu/S14P31A304
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      changes:
        - BE/**/*
        - INFRA/Dockerfile.be
        - INFRA/deploy-be.sh
        - INFRA/docker-compose.be.yml
  script:
    - git config --global credential.helper store
    - cp /home/ubuntu/.git-credentials /root/.git-credentials
    - cd /home/ubuntu/S14P31A304
    - git config pull.rebase false
    - git pull origin prod
    - PROJECT_DIR=/home/ubuntu/S14P31A304 bash INFRA/deploy-be.sh

