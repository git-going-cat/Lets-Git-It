services:
  nginx:
    build:
      context: ..
      dockerfile: INFRA/Dockerfile.fe
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.nginx
    volumes:
      - ../nginx/templates:/etc/nginx/templates
      - ../nginx/conf/00-rate-limit.conf:/etc/nginx/conf.d/00-rate-limit.conf
      - ../nginx/conf/00-upstream.conf:/etc/nginx/conf.d/00-upstream.conf
      - /etc/letsencrypt:/etc/letsencrypt
    restart: always
    networks:
      - letsgit-dev
    environment:
      - TZ=Asia/Seoul
networks:
  letsgit-dev:
    name: letsgit-dev
    external: true
