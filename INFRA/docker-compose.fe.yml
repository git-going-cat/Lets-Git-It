services:

  nginx:
    image: nginx:alpine    # build 대신 공식 이미지 바로 사용
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf:/etc/nginx/conf.d
      - ../certs:/etc/letsencrypt
    restart: always
    networks:
      - letsgit-dev

networks:
  letsgit-dev:
    name: letsgit-dev
    external: true
