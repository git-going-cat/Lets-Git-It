services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: always
    networks:
      - letsgit-dev
    environment:
      - TZ=Asia/Seoul

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: always
    networks:
      - letsgit-dev
    environment:
      - TZ=Asia/Seoul

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: always
    networks:
      - letsgit-dev
    environment:
      - TZ=Asia/Seoul

  grafana-agent:
    image: grafana/alloy:latest
    container_name: grafana-agent
    volumes:
      - ./monitoring/grafana-agent/agent-config.alloy:/etc/alloy/config.alloy
    command: run /etc/alloy/config.alloy
    ports:
      - "10.0.0.1:12347:12347"
    restart: always
    networks:
      - letsgit-dev
    environment:
      - TZ=Asia/Seoul

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "10.0.0.1:3000:3000"
    env_file:
      - .env
    restart: always
    networks:
      - letsgit-dev
    environment:
      - TZ=Asia/Seoul
      - GF_SERVER_ROOT_URL=http://10.0.0.1:3000

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  letsgit-dev:
    name: letsgit-dev
    external: true
